[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "isingmark-structured"
version = "0.1.0"
description = "Generators for the structured Ising families that isingmark replays with --instances"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
isingmark-structured = "isingmark_structured.generate:main"

[tool.setuptools.packages.find]
include = ["isingmark_structured*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
include = ["isingmark_structured", "tests"]
