# Complete throughput config: runnable as
#   isingmark throughput --config examples/configs/throughput_cpu.yaml
# with no other flags.
backend: cpu-sa
topology_preset: smoke
hardness: 0.5
seed: 0
output_dir: ./out
duration: 30s
param_curve:
  min_reads: 8
  max_reads: 64
  min_sweeps: 100
  max_sweeps: 1000
  min_anneal_us: 5
  max_anneal_us: 200
