# Comparative config for the dwave backend.
#
# Requires a records.jsonl from a prior run as target_file (reference.jsonl
# is not shipped). Example:
#   isingmark comparative --config examples/configs/comparative_dwave.yaml
# after placing a prior run's records at ./reference.jsonl (or editing
# target_file below). A real run also needs the quip-dwave-qa binary on PATH.
#
# param_curve deliberately differs from the built-in default so the file value is exercised.
backend: dwave
topology_preset: smoke
seed: 0
output_dir: ./out
target_file: reference.jsonl
num_jobs: 20
max_iterations: 10
param_curve:
  min_reads: 16
  max_reads: 128
  min_sweeps: 200
  max_sweeps: 2000
  min_anneal_us: 10
  max_anneal_us: 400
