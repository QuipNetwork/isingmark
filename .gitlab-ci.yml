# IsingMark CI
#
# Toolchain matches rust-toolchain.toml (1.97.1). Stages run in order:
# fmt, clippy, test, build with plot feature.
#
# Miner binaries: fetch via upstream fetch-miners.sh onto $PATH and run
# tests WITHOUT ISINGMARK_ALLOW_MISSING_MINERS=1 so the real probe and
# session paths execute. Do not set that skip variable in CI.
#
# fetch-miners.sh writes to its DEST argument (default ./miners relative to
# CWD). Real miner tests need quip-cpu-sa on $PATH. MINER_SET=cpu pulls the
# CPU miners on Linux CI images; metal and dwave are not required for the
# fail-by-default real-binary tests.

variables:
  CARGO_TERM_COLOR: always
  # Pinned toolchain (must match rust-toolchain.toml channel).
  RUST_VERSION: "1.97.1"
  # Crate deps pin this git rev (see Cargo.toml / Cargo.lock).
  QUIP_MINER_REV: "e667365bef7efbf91ff0d4c988fcfc648e6cc9b6"
  QUIP_MINER_REPO: "https://gitlab.com/quip.network/quip-miner.git"
  # Package-registry tag used by fetch-miners.sh. Default in the script at
  # QUIP_MINER_REV is v0.3.0-rc2; set explicitly here so the coupling to the
  # crate rev is visible. Keep this in sync when bumping QUIP_MINER_REV /
  # the pinned quip-miner crates — do not change one without checking the other.
  #
  # The tag and the rev must move together. At this rev the script names assets
  # NAME-OS-ARCH, and only v0.3.0-rc2 and later publish that form. Pointing this
  # rev at an earlier tag gives a 404 on every asset.
  MINERS_TAG: "v0.3.0-rc2"
  MINERS_DIR: "${CI_PROJECT_DIR}/miners"

default:
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - rustc --version
    - cargo --version
    # quip-proto's build script runs prost-build, which shells out to protoc.
    # Every job that compiles the crate needs it; the rust image does not
    # ship it. Without it the build fails at quip-proto with "Could not find
    # `protoc`", before any lint or test runs.
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler
    - protoc --version
    - rustup component add rustfmt clippy

stages:
  - fmt
  - clippy
  - test
  - build

fmt:
  stage: fmt
  script:
    - cargo fmt --check

clippy:
  stage: clippy
  script:
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --all-targets --features plot -- -D warnings

test:
  stage: test
  before_script:
    - rustc --version
    - cargo --version
    # This job replaces the default before_script, so it must install protoc
    # itself (see the default block for why the build needs it).
    # Fetch CPU miner binaries onto $PATH (upstream script from quip-miner).
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler git ca-certificates curl
    - protoc --version
    - git clone --filter=blob:none --no-checkout "${QUIP_MINER_REPO}" /tmp/quip-miner
    - git -C /tmp/quip-miner fetch --depth 1 origin "${QUIP_MINER_REV}"
    - git -C /tmp/quip-miner checkout "${QUIP_MINER_REV}"
    # MINERS_TAG is set in variables above; export so the script does not
    # rely on its internal default alone.
    - export MINERS_TAG="${MINERS_TAG}"
    - MINER_SET=cpu bash /tmp/quip-miner/crates/quip-coordinator/tools/fetch-miners.sh "${MINERS_DIR}"
    - export PATH="${MINERS_DIR}:${PATH}"
    # Fail the job if the real binary is still missing (do not soft-skip).
    - command -v quip-cpu-sa
  script:
    # Intentionally NO ISINGMARK_ALLOW_MISSING_MINERS: real miner path only.
    - cargo test --all-targets
    - cargo test --all-targets --features plot

build_plot:
  stage: build
  script:
    - cargo build --features plot
