# IsingMark CI
#
# Toolchain matches rust-toolchain.toml (1.97.1). Stages run in order:
# fmt, clippy, test, build with plot feature.
#
# Miner binaries: fetch with tools/fetch-miners.sh, which resolves the newest
# quip-solver-<x> release of each miner, onto $PATH and run tests WITHOUT
# ISINGMARK_ALLOW_MISSING_MINERS=1 so the real probe and session paths
# execute. Do not set that skip variable in CI.
#
# fetch-miners.sh writes to its DEST argument (default ./miners relative to
# CWD). Real miner tests need quip-cpu-sa on $PATH. MINER_SET=cpu pulls the
# CPU miners on Linux CI images; metal and dwave are not required for the
# fail-by-default real-binary tests.

include:
  - project: quip.network/ci-templates
    ref: v1.1.1
    file: templates/dependency-gate.yml

variables:
  CARGO_TERM_COLOR: always
  # Pinned toolchain (must match rust-toolchain.toml channel).
  RUST_VERSION: "1.97.1"
  MINERS_DIR: "${CI_PROJECT_DIR}/miners"

default:
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - rustc --version
    - cargo --version
    - rustup component add rustfmt clippy

stages:
  - fmt
  - clippy
  - test
  - build

fmt:
  stage: fmt
  script:
    - cargo fmt --check

clippy:
  stage: clippy
  script:
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --all-targets --features plot -- -D warnings

test:
  stage: test
  before_script:
    - rustc --version
    - cargo --version
    # This job replaces the default before_script, so it repeats the toolchain
    # steps it needs. Fetch CPU miner binaries onto $PATH (newest
    # quip-solver-<x> releases).
    - apt-get update -qq && apt-get install -y -qq ca-certificates curl
    - MINER_SET=cpu bash tools/fetch-miners.sh "${MINERS_DIR}"
    - export PATH="${MINERS_DIR}:${PATH}"
    # Fail the job if the real binary is still missing (do not soft-skip).
    - command -v quip-cpu-sa
  script:
    # Intentionally NO ISINGMARK_ALLOW_MISSING_MINERS: real miner path only.
    - cargo test --all-targets
    - cargo test --all-targets --features plot

build_plot:
  stage: build
  script:
    - cargo build --features plot
