[package]
name = "isingmark"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.97"

[lints.rust]
unsafe-code = "deny"

[lints.clippy]
panic = "deny"
panic-in-result-fn = "deny"
unimplemented = "deny"
todo = "deny"
allow-attributes = "deny"
print-stdout = "deny"
print-stderr = "deny"
exit = "deny"
mem-forget = "deny"
await-holding-lock = "deny"
unwrap-used = "deny"
pedantic = { level = "warn", priority = -1 }

[dependencies]
quip-proto = "0.0.2"
quip-protocol = "0.0.2"
quip-solver-core = "0.0.2"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.0.0", default-features = false, features = ["deserialize"] }
blake3 = "1"
blake2 = "0.10"
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["std"] }
plotters = { version = "0.3", optional = true }

[features]
plot = ["dep:plotters"]

[dev-dependencies]
ising-generators = "0.0.4"
tempfile = "3"
